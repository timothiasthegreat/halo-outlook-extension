<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Halo Authentication</title>
  <!-- Office.js is required for messageParent to work inside an Office dialog -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: Segoe UI, sans-serif;
      text-align: center;
      padding: 40px;
      color: #333;
      background: #f5f5f5;
    }
    .checkmark { font-size: 48px; margin-bottom: 12px; }
    h2 { margin: 0 0 8px 0; }
    p { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="checkmark">&#10003;</div>
  <h2>Authenticated</h2>
  <p>You can close this window.</p>

  <script>
    // Wait for Office.js to initialize, then send the auth code to the parent
    Office.onReady(function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var error = params.get("error");

      if (code) {
        Office.context.ui.messageParent(JSON.stringify({ code: code }));
      } else {
        var description = params.get("error_description") || error || "No authorization code returned";
        Office.context.ui.messageParent(JSON.stringify({ error: description }));
      }
    });
  </script>
</body>
</html>
