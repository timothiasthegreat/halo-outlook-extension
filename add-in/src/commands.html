<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halo Ticket Bridge Runtime</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <script>
    // The OnMessageSend handler must not run until Office.js is fully initialized.
    // We load the webpack bundle dynamically after Office.onReady() fires.
    Office.onReady(function() {
      var script = document.createElement('script');
      script.src = 'launchevent.js';
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
