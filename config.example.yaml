# Halo Outlook Extension — Watcher Configuration
# Copy this to config.yaml and fill in your values

# HaloPSA connection
halo:
  # Your HaloPSA instance URL (e.g. https://your-instance.halopsa.com)
  instance_url: https://your-instance.halopsa.com

  # OAuth2 client ID (for PKCE auth code flow — no client secret needed)
  # From Configuration → Integrations → Halo API → OAuth Application
  client_id: ""

  # OAuth2 client secret — NOT required for PKCE auth (the add-in handles auth)
  # Leave empty unless you're using client credentials (deprecated path)
  client_secret: ""

  # Ticket action IDs — discover these from your Halo instance
  # Use scripts/setup_check.py --discover-actions to find yours
  actions:
    email_received: 0
    email_sent: 16
    internal_note: 7

  # Custom field ID that stores the conversationId on tickets
  custom_field_conv_id: 285

  # Default ticket type for new tickets created from conversations
  default_ticket_type_id: 1

# Microsoft Graph connection (for email monitoring)
graph:
  # Azure AD tenant ID
  tenant_id: ""

  # App registration client ID (requires Mail.Read application permission)
  client_id: ""

  # Client secret for unattended Graph API access
  client_secret: ""

  # Default mailbox — per-user mailboxes are registered via the add-in
  user_email: ""

# Watcher behavior
watcher:
  # How often to poll for new messages (in seconds)
  poll_interval_seconds: 90

  # Stop watching conversations after N days of silence
  stale_conversation_days: 14

  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: INFO

  # SQLite database path (relative to working directory or absolute)
  state_db_path: state.db